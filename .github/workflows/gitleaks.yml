name: Gitleaks

# Scans commits for secrets. LukePalmDev is a personal account, so
# gitleaks-action does not need a GITLEAKS_LICENSE. An organization
# repository would have to store that secret before this job can pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
